name: Actualizar dashboard

on:
  schedule:
    # Lunes a viernes, 17:00 y 20:00 hora de CDMX (UTC-6): después de que USDA y Banxico publican
    - cron: "0 23 * * 1-5"
    - cron: "0 2 * * 2-6"
    # Lunes a viernes, 9:00 CDMX: actualiza y envía el correo del Pulso McAllen
    - cron: "0 15 * * 1-5"
  workflow_dispatch:  # botón "Run workflow" para actualizar a mano
    inputs:
      correo:
        description: "Correo del Pulso"
        type: choice
        options: ["no", "prueba", "enviar"]
        default: "no"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Descargar datos y generar dashboard
        env:
          USDA_KEY: ${{ secrets.USDA_KEY }}
          BANXICO_TOKEN: ${{ secrets.BANXICO_TOKEN }}
          COMTRADE_KEY: ${{ secrets.COMTRADE_KEY }}
          CENSUS_KEY: ${{ secrets.CENSUS_KEY }}
        run: python historico.py

      - name: Guardar datos actualizados en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/
          git diff --cached --quiet || git commit -m "Datos al $(date -u +%Y-%m-%d)"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Enviar correo del Pulso
        # a las 9:00, o a mano eligiendo "prueba" (solo al remitente) o "enviar"
        if: github.event.schedule == '0 15 * * 1-5' || (github.event_name == 'workflow_dispatch' && inputs.correo != 'no')
        env:
          SMTP_USUARIO: ${{ secrets.SMTP_USUARIO }}
          SMTP_CLAVE: ${{ secrets.SMTP_CLAVE }}
          CORREO_PARA: ${{ secrets.CORREO_PARA }}
          CORREO_CC: ${{ secrets.CORREO_CC }}
          MODO: ${{ inputs.correo == 'prueba' && '--prueba' || '' }}
        run: |
          if [ -z "$SMTP_USUARIO" ]; then echo "Correo no configurado todavía; no se envía."; exit 0; fi
          python enviar_correo.py $MODO
